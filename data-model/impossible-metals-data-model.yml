traversal:
  mechanism: _links + _embed
  note: >-
    Every record carries an _links block (HAL-ish, not HAL-conformant) naming the routes for its author,
    featured media, terms, replies and versions. Adding ?_embed inlines those under _embedded, which lets
    an agent resolve a post's author, image and taxonomy terms in one request instead of four.
id_prefixes: []
id_note: >-
  All identifiers are bare integers with no type prefix and no global uniqueness across entity types —
  post 1234 and term 1234 are unrelated. The events surface additionally exposes a `global_id` of the form
  impossiblemetals.com?id=<n>, which is the only site-scoped identifier on the surface.
