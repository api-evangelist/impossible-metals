source: mcp/impossible-metals-mcp.yml + openapi/*.yml
description: >-
  Binds each CANDIDATE MCP tool to the REST operation that backs it. Impossible Metals publishes no MCP
  server and no GraphQL surface, so this crosswalk is a derivation over the REST contracts in this repo,
  not a map of a shipped agent surface. Confidence is high throughout because every tool was derived
  one-to-one from a named operation — there is no name-matching guesswork. The exception is the events
  family: the OpenAPI document Impossible Metals' host publishes at /wp-json/tribe/events/v1/doc carries
  NO operationId on any of its 30 operations, so those rows bind by HTTP method + path instead.
