aid: impossible-metals
name: Impossible Metals
description: >-
  Impossible Metals is a deep-ocean robotics and critical-minerals company founded in 2020 by CEO
  Oliver Gunasekara, headquartered in San Jose, California with a robotics lab in Canada, and a
  member of Y Combinator's W22 cohort. It builds the Eureka autonomous underwater vehicle, a
  hovering AUV that uses computer vision and robotic arms to pick polymetallic nodules from the
  seabed one at a time — leaving visible fauna and the sediment layer in place — as an alternative
  to the dredge-and-riser designs used elsewhere in deep-sea mining. Eureka I and Eureka II have
  been sea-tested, Eureka III is slated for a 2026 test in the BGR contract area of the
  Clarion-Clipperton Zone, and the company has applied for a deep-sea mining lease in U.S. federal
  waters and for observer status with the International Seabed Authority. It is a certified B Corp
  and publishes environmental data, policy positions and testimony alongside its technical work.
  Impossible Metals is a robotics and mining company rather than a software vendor: it operates no
  developer program, publishes no product API, SDKs or developer portal, and hosts no api. or
  developer. subdomain. The only machine-readable interfaces it serves are the WordPress REST
  content API behind impossiblemetals.com and the two OpenAPI documents its events plugin publishes
  on that same host, which are captured here for discovery purposes and are anonymously readable
  and read-only.
