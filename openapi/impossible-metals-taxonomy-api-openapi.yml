components:
  schemas:
    Type:
      type: object
      properties:
        capabilities:
          type: object
          description: All capabilities used by the post type.
          readOnly: true
        description:
          type: string
          description: A human-readable description of the post type.
          readOnly: true
        hierarchical:
          type: boolean
          description: Whether or not the post type should have children.
          readOnly: true
        viewable:
          type: boolean
          description: Whether or not the post type can be viewed.
          readOnly: true
        labels:
          type: object
          description: Human-readable labels for the post type for various contexts.
          readOnly: true
        name:
          type: string
          description: The title for the post type.
          readOnly: true
        slug:
          type: string
          description: An alphanumeric identifier for the post type.
          readOnly: true
        supports:
          type: object
          description: All features, supported by the post type.
          readOnly: true
        has_archive:
          type:
          - string
          - boolean
          description: If the value is a string, the value will be used as the archive slug. If the value is false the post type has no archive.
          readOnly: true
        taxonomies:
          type: array
          description: Taxonomies associated with post type.
          readOnly: true
          items:
            type: string
        rest_base:
          type: string
          description: REST base route for the post type.
          readOnly: true
        rest_namespace:
          type: string
          description: REST route's namespace for the post type.
          readOnly: true
        visibility:
          type: object
          description: The visibility settings for the post type.
          readOnly: true
          properties:
            show_ui:
              type: boolean
              description: Whether to generate a default UI for managing this post type.
            show_in_nav_menus:
              type: boolean
              description: Whether to make the post type available for selection in navigation menus.
        icon:
          type: string
          description: The icon for the post type.
          readOnly: true
        template:
          type: array
          description: The block template associated with the post type.
          readOnly: true
        template_lock:
          type:
          - string
          - boolean
          description: The template_lock associated with the post type, or false if none.
          enum:
          - all
          - insert
          - contentOnly
          - false
          readOnly: true
    Category:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the term.
          readOnly: true
        count:
          type: integer
          description: Number of published posts for the term.
          readOnly: true
        description:
          type: string
          description: HTML description of the term.
        link:
          type: string
          description: URL of the term.
          format: uri
          readOnly: true
        name:
          type: string
          description: HTML title for the term.
        slug:
          type: string
          description: An alphanumeric identifier for the term unique to its type.
        taxonomy:
          type: string
          description: Type attribution for the term.
          enum:
          - category
          readOnly: true
        parent:
          type: integer
          description: The parent term ID.
        meta:
          type: object
          description: Meta fields.
    Taxonomy:
      type: object
      properties:
        capabilities:
          type: object
          description: All capabilities used by the taxonomy.
          readOnly: true
        description:
          type: string
          description: A human-readable description of the taxonomy.
          readOnly: true
        hierarchical:
          type: boolean
          description: Whether or not the taxonomy should have children.
          readOnly: true
        labels:
          type: object
          description: Human-readable labels for the taxonomy for various contexts.
          readOnly: true
        name:
          type: string
          description: The title for the taxonomy.
          readOnly: true
        slug:
          type: string
          description: An alphanumeric identifier for the taxonomy.
          readOnly: true
        show_cloud:
          type: boolean
          description: Whether or not the term cloud should be displayed.
          readOnly: true
        types:
          type: array
          description: Types associated with the taxonomy.
          readOnly: true
          items:
            type: string
        rest_base:
          type: string
          description: REST base route for the taxonomy.
          readOnly: true
        rest_namespace:
          type: string
          description: REST namespace route for the taxonomy.
          readOnly: true
        visibility:
          type: object
          description: The visibility settings for the taxonomy.
          readOnly: true
          properties:
            public:
              type: boolean
              description: Whether a taxonomy is intended for use publicly either via the admin interface or by front-end users.
            publicly_queryable:
              type: boolean
              description: Whether the taxonomy is publicly queryable.
            show_ui:
              type: boolean
              description: Whether to generate a default UI for managing this taxonomy.
            show_admin_column:
              type: boolean
              description: Whether to allow automatic creation of taxonomy columns on associated post-types table.
            show_in_nav_menus:
              type: boolean
              description: Whether to make the taxonomy available for selection in navigation menus.
            show_in_quick_edit:
              type: boolean
              description: Whether to show the taxonomy in the quick/bulk edit panel.
    Tag:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the term.
          readOnly: true
        count:
          type: integer
          description: Number of published posts for the term.
          readOnly: true
        description:
          type: string
          description: HTML description of the term.
        link:
          type: string
          description: URL of the term.
          format: uri
          readOnly: true
        name:
          type: string
          description: HTML title for the term.
        slug:
          type: string
          description: An alphanumeric identifier for the term unique to its type.
        taxonomy:
          type: string
          description: Type attribution for the term.
          enum:
          - post_tag
          readOnly: true
        meta:
          type: object
          description: Meta fields.
    RestError:
      type: object
      description: The WordPress REST API error envelope. Not RFC 9457 problem+json — it is served as application/json with a WordPress-specific code/message/data shape.
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: Machine-readable WordPress error code, e.g. rest_post_invalid_id.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
            params:
              type: object
              description: Per-parameter validation messages, present on rest_invalid_param.
