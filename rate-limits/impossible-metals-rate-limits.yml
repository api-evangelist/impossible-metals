enforcement:
  layer: cloudflare
  observed: >-
    Responses are served through Cloudflare with cf-edge-cache "cache,platform=wordpress". Cloudflare's
    default bot and WAF policy is the only throttling actually in evidence: HTTP OPTIONS requests sent
    without a browser User-Agent were answered 403, and the same requests sent with one were answered
    200. That is a bot rule, not a documented rate limit, and it is undocumented, unversioned and can
    change without notice.
  advice: >-
    Send a real, identifying User-Agent, honour cache-control, and back off exponentially on any 403 or
    5xx. Do not assume a published budget exists — none does.
